name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Types, lint, 100% coverage, the production build, and the two build-artifact
  # gates (client-bundle secrets, landing JS budget). No database needed.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The database-backed tiers (plan §6-S16 step 4). A separate job so a type
  # error fails in seconds instead of after a Postgres has booted, and so the
  # two run in parallel.
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      # A local stack's keys are the CLI's fixed development keys — published in
      # Supabase's own docs, not secrets. Exported so the app and the specs agree
      # on them rather than relying on the defaults baked into the tests.
      - name: Export local stack credentials
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests (RLS, repositories, webhooks, print interlock)
        run: npm run test:integration

      - run: npx playwright install --with-deps chromium

      # Every "(Supabase + worker)" spec fails without this process: it is what
      # drains generation, ingestion, validation, slicing and notification jobs.
      - name: Start the job worker
        run: npm run dev:worker &

      - name: End-to-end journeys
        run: npm run e2e
        env:
          CI: "true"
          E2E_SUPABASE: "1"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
