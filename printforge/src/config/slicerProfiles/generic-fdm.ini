; OWNER DECISION REQUIRED — placeholder PrusaSlicer profile for the Generic FDM
; printer (220x220x250, 0.4 mm nozzle). Replace with the real tuned profile before
; enabling SLICER=prusa in production. Only used when SLICER=prusa; the default
; MockSlicer ignores it.
[printer_settings]
printer_model = Generic FDM
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250

[print_settings]
layer_height = 0.2
fill_density = 25%
support_material = 1
support_material_threshold = 55
